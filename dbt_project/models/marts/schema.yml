version: 2
models:
  - name: fct_order_lines
    description: Completed product sales to identified customers, one row per invoice line.
    columns:
      - name: line_id
        tests: [unique, not_null]
      - name: invoice
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('fct_orders'), field: invoice}
      - name: stock_code
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_product'), field: stock_code}
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_id}
      - name: quantity
        tests: [not_null]
      - name: line_amount
        tests: [not_null]
  - name: fct_orders
    description: One row per invoice.
    columns:
      - name: invoice
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_day}
      - name: revenue
        tests: [not_null]
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: country
        tests: [not_null]
      - name: orders
        tests: [not_null]
  - name: dim_product
    columns:
      - name: stock_code
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]
  - name: mart_customer_weekly
    columns:
      - name: customer_id
        tests: [not_null]
      - name: week_start
        tests: [not_null]
  - name: mart_monthly_revenue
    columns:
      - name: month_start
        tests: [unique, not_null]
      - name: revenue
        tests: [not_null]
  - name: mart_monthly_cancellations
    columns:
      - name: month_start
        tests: [unique, not_null]
